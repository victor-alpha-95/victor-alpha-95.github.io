<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" role="img" aria-labelledby="sb-title sb-desc">
  <title id="sb-title">One session's output becomes the next session's input</title>
  <desc id="sb-desc">A loop of four steps left to right: a Session on any surface; a Digest, one page written overnight; the Wiki, where at most three cards are updated; and the Brief, a 1,500-token desk note. A dashed arc returns from Brief to Session, labelled the next session reads it first. Below the loop, a rail labelled The human gate: anything that needs a decision goes to a Sunday queue, and a job that fails twice pauses itself and files a note there.</desc>
  <defs>
    <marker id="sba" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f54eb"/>
    </marker>
    <marker id="sbm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5c5c66"/>
    </marker>
  </defs>

  <rect width="760" height="420" rx="14" fill="#faf9f6"/>
  <text x="30" y="40" font-size="13" font-weight="700" fill="#5c5c66" letter-spacing="2">ONE SESSION'S OUTPUT, THE NEXT SESSION'S INPUT</text>

  <!-- step cards -->
  <g>
    <rect x="30"  y="78" width="150" height="112" rx="10" fill="#ffffff" stroke="#e6e4dd"/>
    <rect x="213" y="78" width="150" height="112" rx="10" fill="#ffffff" stroke="#e6e4dd"/>
    <rect x="396" y="78" width="150" height="112" rx="10" fill="#ffffff" stroke="#e6e4dd"/>
    <rect x="579" y="78" width="150" height="112" rx="10" fill="#ffffff" stroke="#e6e4dd"/>
  </g>
  <g font-size="12" font-weight="700" fill="#2f54eb">
    <circle cx="52"  cy="100" r="11" fill="#e7ebfd"/><text x="52"  y="104" text-anchor="middle">1</text>
    <circle cx="235" cy="100" r="11" fill="#e7ebfd"/><text x="235" y="104" text-anchor="middle">2</text>
    <circle cx="418" cy="100" r="11" fill="#e7ebfd"/><text x="418" y="104" text-anchor="middle">3</text>
    <circle cx="601" cy="100" r="11" fill="#e7ebfd"/><text x="601" y="104" text-anchor="middle">4</text>
  </g>
  <g font-size="18" font-weight="700" fill="#15151a">
    <text x="105" y="140" text-anchor="middle">SESSION</text>
    <text x="288" y="140" text-anchor="middle">DIGEST</text>
    <text x="471" y="140" text-anchor="middle">WIKI</text>
    <text x="654" y="140" text-anchor="middle">BRIEF</text>
  </g>
  <g font-size="13" fill="#5c5c66">
    <text x="105" y="162" text-anchor="middle">you work, any surface</text>
    <text x="105" y="178" text-anchor="middle">nothing to file</text>
    <text x="288" y="162" text-anchor="middle">one page, overnight</text>
    <text x="288" y="178" text-anchor="middle">built · decided · learned</text>
    <text x="471" y="162" text-anchor="middle">cards updated, max 3</text>
    <text x="471" y="178" text-anchor="middle">pointers, not copies</text>
    <text x="654" y="162" text-anchor="middle">the desk note</text>
    <text x="654" y="178" text-anchor="middle">~1,500 tokens</text>
  </g>

  <!-- forward arrows -->
  <g stroke="#2f54eb" stroke-width="2" fill="none" marker-end="url(#sba)">
    <path d="M180,134 L211,134"/>
    <path d="M363,134 L394,134"/>
    <path d="M546,134 L577,134"/>
  </g>

  <!-- feedback arc: brief -> session -->
  <path d="M654,190 C654,250 105,250 105,190" stroke="#2f54eb" stroke-width="2" stroke-dasharray="6 5" fill="none" marker-end="url(#sba)"/>
  <rect x="268" y="222" width="224" height="24" rx="12" fill="#faf9f6"/>
  <text x="380" y="238" font-size="12.5" font-weight="700" fill="#2f54eb" text-anchor="middle">the next session reads it first</text>

  <!-- human gate rail -->
  <rect x="30" y="286" width="699" height="104" rx="10" fill="#ffffff" stroke="#e6e4dd"/>
  <text x="52" y="312" font-size="12" font-weight="700" fill="#5c5c66" letter-spacing="2">THE HUMAN GATE</text>
  <g font-size="13" fill="#15151a">
    <text x="52" y="340">Anything that needs a decision goes to a four-line queue, read on Sundays.</text>
    <text x="52" y="362">A job that fails twice pauses itself and files a note in the same queue.</text>
  </g>
  <g font-size="13" font-weight="700" fill="#2f54eb">
    <text x="706" y="340" text-anchor="end">30 min / week</text>
    <text x="706" y="362" text-anchor="end">0 / day</text>
  </g>
  <!-- ties from loop to rail -->
  <g stroke="#5c5c66" stroke-width="1.5" stroke-dasharray="3 4" fill="none" marker-end="url(#sbm)">
    <path d="M288,190 L288,284"/>
    <path d="M471,190 L471,284"/>
  </g>
</svg>
