<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" role="img" aria-labelledby="fl-title fl-desc">
  <title id="fl-title">The Fable Method loop</title>
  <desc id="fl-desc">A single loop of four steps left to right: Recall past lessons, Work with discipline across four modes (solve, build, guide, answer), Verify against evidence or say unverified, and Record the lesson. A dashed feedback arc returns from Record back to Recall, labelled lessons compound across sessions.</desc>
  <defs>
    <marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f54eb"/>
    </marker>
  </defs>

  <rect width="760" height="360" rx="14" fill="#faf9f6"/>
  <text x="30" y="40" font-size="13" font-weight="700" fill="#5c5c66" letter-spacing="2">ONE LOOP, FOUR MODES</text>

  <g>
    <rect x="30"  y="78" width="150" height="104" rx="10" fill="#ffffff" stroke="#e6e4dd"/>
    <rect x="213" y="78" width="150" height="104" rx="10" fill="#ffffff" stroke="#e6e4dd"/>
    <rect x="396" y="78" width="150" height="104" rx="10" fill="#ffffff" stroke="#e6e4dd"/>
    <rect x="579" y="78" width="150" height="104" rx="10" fill="#ffffff" stroke="#e6e4dd"/>
  </g>

  <g font-size="12" font-weight="700" fill="#2f54eb">
    <circle cx="52"  cy="100" r="11" fill="#e7ebfd"/><text x="52"  y="104" text-anchor="middle">1</text>
    <circle cx="235" cy="100" r="11" fill="#e7ebfd"/><text x="235" y="104" text-anchor="middle">2</text>
    <circle cx="418" cy="100" r="11" fill="#e7ebfd"/><text x="418" y="104" text-anchor="middle">3</text>
    <circle cx="601" cy="100" r="11" fill="#e7ebfd"/><text x="601" y="104" text-anchor="middle">4</text>
  </g>

  <g font-size="18" font-weight="700" fill="#15151a">
    <text x="105" y="140" text-anchor="middle">RECALL</text>
    <text x="288" y="140" text-anchor="middle">WORK</text>
    <text x="471" y="140" text-anchor="middle">VERIFY</text>
    <text x="654" y="140" text-anchor="middle">RECORD</text>
  </g>
  <g font-size="13" fill="#5c5c66">
    <text x="105" y="162" text-anchor="middle">read past lessons</text>
    <text x="288" y="162" text-anchor="middle">with discipline</text>
    <text x="471" y="162" text-anchor="middle">against evidence</text>
    <text x="654" y="162" text-anchor="middle">append the lesson</text>
  </g>

  <g stroke="#2f54eb" stroke-width="2" marker-end="url(#fa)">
    <line x1="182" y1="130" x2="211" y2="130"/>
    <line x1="365" y1="130" x2="394" y2="130"/>
    <line x1="548" y1="130" x2="577" y2="130"/>
  </g>

  <text x="288" y="205" text-anchor="middle" font-size="11.5" font-weight="600" fill="#2f54eb" letter-spacing="0.5">SOLVE · BUILD · GUIDE · ANSWER</text>
  <text x="471" y="205" text-anchor="middle" font-size="11.5" font-weight="600" fill="#2f54eb">…or say UNVERIFIED</text>

  <path d="M654,182 C654,285 105,285 105,190" fill="none" stroke="#2f54eb" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#fa)"/>
  <text x="379" y="300" text-anchor="middle" font-size="13.5" font-weight="600" fill="#15151a">lessons compound across sessions</text>
  <text x="379" y="322" text-anchor="middle" font-size="12" fill="#5c5c66">an append-only journal the agent reads before it starts and writes when it finishes</text>
</svg>
