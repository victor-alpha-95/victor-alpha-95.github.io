<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" role="img" aria-labelledby="le-title le-desc">
  <title id="le-title">The librarian and the editor</title>
  <desc id="le-desc">Two columns. Left, The Editor, which is me: decides what enters, asks the questions, runs the weekly editorial meeting, publishes, purges or stops collecting. Right, The Librarian, which is the AI: catalogues every arrival, updates the subject cards it touches, leaves a morning desk note, does the weekly stock-take, and never decides what the library is for. Between them, three objects flow left to right: acquisitions (the sources folder), the catalogue (the wiki), and the desk note (the brief).</desc>
  <defs>
    <marker id="lea" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f54eb"/>
    </marker>
  </defs>

  <rect width="760" height="400" rx="14" fill="#faf9f6"/>
  <text x="30" y="40" font-size="13" font-weight="700" fill="#5c5c66" letter-spacing="2">THE LIBRARIAN AND THE EDITOR</text>

  <!-- editor card -->
  <rect x="30" y="70" width="330" height="170" rx="10" fill="#ffffff" stroke="#e6e4dd"/>
  <text x="52" y="100" font-size="18" font-weight="700" fill="#15151a">THE EDITOR</text>
  <text x="52" y="118" font-size="12.5" fill="#2f54eb" font-weight="700">me · decides</text>
  <g font-size="13" fill="#5c5c66">
    <text x="52" y="148">decides what enters the building</text>
    <text x="52" y="170">asks the questions</text>
    <text x="52" y="192">one editorial meeting a week</text>
    <text x="52" y="214">publishes, purges, stops collecting</text>
  </g>

  <!-- librarian card -->
  <rect x="400" y="70" width="330" height="170" rx="10" fill="#ffffff" stroke="#e6e4dd"/>
  <text x="422" y="100" font-size="18" font-weight="700" fill="#15151a">THE LIBRARIAN</text>
  <text x="422" y="118" font-size="12.5" fill="#2f54eb" font-weight="700">the AI · maintains</text>
  <g font-size="13" fill="#5c5c66">
    <text x="422" y="148">catalogues every arrival</text>
    <text x="422" y="170">updates the cards it touches</text>
    <text x="422" y="192">leaves the morning desk note</text>
    <text x="422" y="214">stock-take weekly · never decides what it's for</text>
  </g>

  <!-- the library objects -->
  <text x="30" y="282" font-size="12" font-weight="700" fill="#5c5c66" letter-spacing="2">THE LIBRARY</text>
  <g>
    <rect x="30"  y="296" width="210" height="74" rx="10" fill="#ffffff" stroke="#e6e4dd"/>
    <rect x="275" y="296" width="210" height="74" rx="10" fill="#ffffff" stroke="#e6e4dd"/>
    <rect x="520" y="296" width="210" height="74" rx="10" fill="#ffffff" stroke="#e6e4dd"/>
  </g>
  <g font-size="15" font-weight="700" fill="#15151a">
    <text x="135" y="326" text-anchor="middle">acquisitions</text>
    <text x="380" y="326" text-anchor="middle">the catalogue</text>
    <text x="625" y="326" text-anchor="middle">the desk note</text>
  </g>
  <g font-size="12.5" fill="#5c5c66">
    <text x="135" y="348" text-anchor="middle">sources/ · the editor's call</text>
    <text x="380" y="348" text-anchor="middle">wiki/ · the librarian's work</text>
    <text x="625" y="348" text-anchor="middle">brief.md · read first, every day</text>
  </g>
  <g stroke="#2f54eb" stroke-width="2" fill="none" marker-end="url(#lea)">
    <path d="M240,333 L273,333"/>
    <path d="M485,333 L518,333"/>
  </g>

  <!-- ownership ties -->
  <g stroke="#2f54eb" stroke-width="1.5" stroke-dasharray="3 4" fill="none">
    <path d="M135,240 L135,294"/>
    <path d="M565,240 L565,294" />
    <path d="M380,240 L380,294" stroke="#5c5c66"/>
  </g>
</svg>
